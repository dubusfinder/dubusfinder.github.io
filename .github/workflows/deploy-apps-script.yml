name: Deploy Apps Script

on:
  push:
    branches:
      - main
    paths:
      - "apps-script/**"
      - ".github/workflows/deploy-apps-script.yml"
      - "app.js"
  pull_request:
    branches:
      - main
    paths:
      - "apps-script/**"
      - ".github/workflows/deploy-apps-script.yml"
      - "app.js"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check apps-script/Code.js
          node --check apps-script/GitHubSync.js
          node - <<'NODE'
          const fs = require('fs');
          const childProcess = require('child_process');
          const html = fs.readFileSync('apps-script/AdminDashboard.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1].trim())
            .filter(Boolean);
          scripts.forEach((source, index) => {
            const path = `/tmp/admin-dashboard-${index}.js`;
            fs.writeFileSync(path, source);
            childProcess.execFileSync(process.execPath, ['--check', path], { stdio: 'inherit' });
          });
          if (!scripts.length) throw new Error('No inline Admin Dashboard JavaScript found.');
          NODE

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Authenticate clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Push Apps Script source
        working-directory: apps-script
        run: clasp push --force

      - name: Update existing Admin Dashboard deployment
        working-directory: apps-script
        env:
          DEPLOYMENT_ID: AKfycbx6QLWoGsMckxiMEQrME8pj35oDp-7HDbP0bcTKkHq7lE2XqwK1SHEs0N6QDj6-gTNa9w
        run: clasp update-deployment "$DEPLOYMENT_ID" --description "DU BUS FINDER - Automatic deployment"

      - name: Update public Website API deployment
        working-directory: apps-script
        env:
          DEPLOYMENT_ID: AKfycbzxpN2M7gA9tz2ZIz4V9zxU18MDxH1A9DUndLrAIqoRaXCeLPa9rHng9dXL5Q2XD4pyQA
        run: clasp update-deployment "$DEPLOYMENT_ID" --description "DU BUS FINDER - Website API automatic deployment"
